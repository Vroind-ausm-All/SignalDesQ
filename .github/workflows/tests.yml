# SignalDesk – automatische Prüfung (Masterplan 2.0, Sprint 6)
# unit:     alle Tests unter Windows und Linux, Python 3.10, 3.13 und 3.14 (ohne Zusatzpakete, wie Variante „basis“)
# install:  Release-ZIP bauen und auf einer frischen Maschine einrichten, starten, sichern, wiederherstellen, neu starten
# e2e:      alle Browser-Tests in Chromium (Variante „browser“); übersprungene Tests gelten als Fehler
# release:  ZIP byte-gleich reproduzierbar, SBOM und Lockdateien aktuell
# audit:    bekannte Schwachstellen (pip-audit), Geheimnisse in Code und Historie (Gitleaks), Fehlerklassen im Code (Ruff) – R0.5
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # Windows braucht für die ganze Suite gut 25 Minuten (Linux 5–7)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13", "3.14"]  # 3.14: neueste voll unterstützte Version (dev68); 3.15 erst ohne 3.10 (rapidfuzz)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lockdateien auf diesem System installierbar (Probelauf, dev67)
        shell: bash
        run: |
          for f in requirements-lock-*.txt; do
            echo "== $f"
            python -m pip install --dry-run --ignore-installed --require-hashes -q -r "$f"
          done
      - name: Tests
        run: python -m unittest discover -s tests

  install:
    name: install (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        variant: [basis, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Release-ZIP bauen
        run: python tools/build_release.py --out dist
      - name: Frische Installation prüfen
        shell: bash
        run: python tools/install_check.py dist/SignalDesk-*[0-9].zip --variant ${{ matrix.variant }} --report install-${{ matrix.os }}-${{ matrix.variant }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: install-${{ matrix.os }}-${{ matrix.variant }}
          path: install-*.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Variante „browser“ (feste Versionen)
        run: |
          python -m pip install --require-hashes -r requirements-lock-browser.txt
          python -m playwright install --with-deps chromium
      - name: Alle Browser-Tests (SDQ-005)
        run: python tools/run_e2e.py --no-skips --min-tests 62

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Reproduzierbar (zweimal bauen, gleiche Prüfsumme)
        run: |
          python tools/build_release.py --out a
          python tools/build_release.py --out b
          cmp a/*.zip b/*.zip
          cat a/*.sha256
      - name: SBOM aktuell
        run: |
          python tools/make_sbom.py --out /tmp/sbom.json --md /tmp/BESTANDTEILE.md
          diff -u sbom/signaldesk.cdx.json /tmp/sbom.json
          diff -u docs/BESTANDTEILE.md /tmp/BESTANDTEILE.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-zip
          path: a/

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
        with:
          fetch-depth: 0  # ganze Historie für Gitleaks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Prüfwerkzeuge (feste Versionen mit Prüfsummen)
        run: python -m pip install --require-hashes -r tools/requirements-lock-dev.txt
      - name: Bekannte Schwachstellen in allen Lockdateien (pip-audit)
        run: |
          for f in requirements-lock-*.txt tools/requirements-lock-dev.txt; do
            echo "== $f"
            pip-audit --require-hashes --disable-pip --progress-spinner off -r "$f"
          done
      - name: Fehlerklassen im Code (Ruff)
        run: ruff check --select E9,F63,F7,F82 --output-format github sales_tool tools tests
      - name: Geheimnisse in Code und Historie (Gitleaks)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
