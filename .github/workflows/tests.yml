# SignalDesk – automatische Prüfung (Masterplan 2.0, Sprint 6)
# unit:     alle Tests unter Windows und Linux, Python 3.10 und 3.13 (ohne Zusatzpakete, wie Variante „basis“)
# install:  Release-ZIP bauen und auf einer frischen Maschine einrichten, starten, sichern, wiederherstellen, neu starten
# e2e:      alle Browser-Tests in Chromium (Variante „browser“); übersprungene Tests gelten als Fehler
# release:  ZIP byte-gleich reproduzierbar, SBOM und Lockdateien aktuell
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests

  install:
    name: install (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        variant: [basis, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Release-ZIP bauen
        run: python tools/build_release.py --out dist
      - name: Frische Installation prüfen
        shell: bash
        run: python tools/install_check.py dist/SignalDesk-*[0-9].zip --variant ${{ matrix.variant }} --report install-${{ matrix.os }}-${{ matrix.variant }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: install-${{ matrix.os }}-${{ matrix.variant }}
          path: install-*.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Variante „browser“ (feste Versionen)
        run: |
          python -m pip install --require-hashes -r requirements-lock-browser.txt
          python -m playwright install --with-deps chromium
      - name: Alle Browser-Tests (SDQ-005)
        run: python tools/run_e2e.py --no-skips --min-tests 58

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (fest gepinnt, SDQ-038)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Reproduzierbar (zweimal bauen, gleiche Prüfsumme)
        run: |
          python tools/build_release.py --out a
          python tools/build_release.py --out b
          cmp a/*.zip b/*.zip
          cat a/*.sha256
      - name: SBOM aktuell
        run: |
          python tools/make_sbom.py --out /tmp/sbom.json --md /tmp/BESTANDTEILE.md
          diff -u sbom/signaldesk.cdx.json /tmp/sbom.json
          diff -u docs/BESTANDTEILE.md /tmp/BESTANDTEILE.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-zip
          path: a/
