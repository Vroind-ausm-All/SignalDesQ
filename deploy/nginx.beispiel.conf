# nginx als TLS-Proxy vor SignalDesk (Zertifikat z. B. über certbot). Hostname und Pfade anpassen.
server {
    listen 443 ssl http2;
    server_name app.example.org;
    ssl_certificate     /etc/letsencrypt/live/app.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 64m;   # Uploads (Import); Wiederherstellen per Upload ist im Mehrmandanten-Server gesperrt

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;                       # unverändert durchreichen (Host-Prüfung)
        proxy_set_header X-Forwarded-Proto https;          # Secure-Cookies
        proxy_set_header X-Forwarded-For $remote_addr;     # nur die echte Client-IP (SignalDesk: --vertrauter-proxy 127.0.0.1)
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    server_name app.example.org;
    return 301 https://$host$request_uri;
}
